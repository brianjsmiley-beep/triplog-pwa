<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />

<meta name="theme-color" content="#14171A" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

<style>

  ::-webkit-scrollbar { display: none; }
</style>

<body>
<div id="root"></div>

<!-- localStorage-backed shim matching the Claude artifact storage API shape -->
<script>
  window.storage = {
    get: async (key) => {
      const v = localStorage.getItem(key);
      return v === null ? null : { key, value: v, shared: false };
    },
    set: async (key, value) => {
      localStorage.setItem(key, value);
      return { key, value, shared: false };
    },
    delete: async (key) => {
      localStorage.removeItem(key);
      return { key, deleted: true, shared: false };
    },
    list: async (prefix) => {
      const keys = Object.keys(localStorage).filter((k) => !prefix || k.startsWith(prefix));
      return { keys, prefix, shared: false };
    },
  };

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("service-worker.js").catch(() => {});
    });
  }
</script>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef, useCallback, useMemo } = React;

// ---- tiny inline icon set (no external icon package needed) ----
const Icon = ({ children, size = 16, className = "", ...props }) => (
  <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor"
       strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} {...props}>
    {children}
  </svg>
);
const Fuel = (p) => <Icon {...p}><line x1="3" y1="22" x2="15" y2="22"/><line x1="4" y1="9" x2="14" y2="9"/><path d="M14 22V4a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v18"/><path d="M14 13h2a2 2 0 0 1 2 2v2a2 2 0 0 0 2 2 2 2 0 0 0 2-2V9.83a2 2 0 0 0-.59-1.42L18 5"/></Icon>;
const MapPin = (p) => <Icon {...p}><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></Icon>;
const Clock = (p) => <Icon {...p}><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></Icon>;
const ChevronDown = (p) => <Icon {...p}><polyline points="6 9 12 15 18 9"/></Icon>;
const TrendingUp = (p) => <Icon {...p}><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></Icon>;
const TrendingDown = (p) => <Icon {...p}><polyline points="23 18 13.5 8.5 8.5 13.5 1 6"/><polyline points="17 18 23 18 23 12"/></Icon>;
const Minus = (p) => <Icon {...p}><line x1="5" y1="12" x2="19" y2="12"/></Icon>;
const Gauge = (p) => <Icon {...p}><path d="M12 15l3.5-3.5"/><path d="M20.3 18.3A9 9 0 1 0 3.7 18.3"/><circle cx="12" cy="15" r="1"/></Icon>;
const Route = (p) => <Icon {...p}><circle cx="6" cy="19" r="3"/><path d="M9 19h8.5a3.5 3.5 0 0 0 0-7h-11a3.5 3.5 0 0 1 0-7H15"/><circle cx="18" cy="5" r="3"/></Icon>;
const DollarSign = (p) => <Icon {...p}><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></Icon>;
const Check = (p) => <Icon {...p}><polyline points="20 6 9 17 4 12"/></Icon>;
const Loader2 = (p) => <Icon {...p}><path d="M21 12a9 9 0 1 1-6.219-8.56"/></Icon>;
const Plus = (p) => <Icon {...p}><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></Icon>;
const Trash2 = (p) => <Icon {...p}><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></Icon>;

// ---- Route plan: elapsed minutes from departure, planned cumulative miles ----
const STOPS = [
  { id: "texarkana", name: "Texarkana, TX", offsetMin: 163, plannedMi: 185 },
  { id: "littlerock", name: "Little Rock, AR", offsetMin: 315, plannedMi: 323 },
  { id: "memphis", name: "Memphis, TN", offsetMin: 466, plannedMi: 460 },
  { id: "nashville", name: "Nashville, TN", offsetMin: 681, plannedMi: 670 },
  { id: "knoxville", name: "Knoxville, TN", offsetMin: 870, plannedMi: 850 },
  { id: "roanoke", name: "Roanoke, VA", offsetMin: 1103, plannedMi: 1080 },
  { id: "harrisonburg", name: "Harrisonburg, VA", offsetMin: 1191, plannedMi: 1175 },
  { id: "harrisburg", name: "Harrisburg, PA", offsetMin: 1355, plannedMi: 1320 },
  { id: "morristown", name: "Morristown, NJ", offsetMin: 1535, plannedMi: 1470 },
  { id: "tarrytown", name: "Tarrytown, NY", offsetMin: 1582, plannedMi: 1505 },
  { id: "stamford", name: "Stamford, CT", offsetMin: 1629, plannedMi: 1540 },
  { id: "seekonk", name: "Seekonk, MA", offsetMin: 1794, plannedMi: 1675, final: true },
];

const CURVE = [{ mi: 0, min: 0 }, ...STOPS.map((s) => ({ mi: s.plannedMi, min: s.offsetMin }))];

function plannedMinAtMiles(mi) {
  if (mi <= 0) return 0;
  const last = CURVE[CURVE.length - 1];
  if (mi >= last.mi) {
    const prev = CURVE[CURVE.length - 2];
    const slope = (last.min - prev.min) / (last.mi - prev.mi);
    return last.min + (mi - last.mi) * slope;
  }
  for (let i = 0; i < CURVE.length - 1; i++) {
    const a = CURVE[i];
    const b = CURVE[i + 1];
    if (mi >= a.mi && mi <= b.mi) {
      const t = b.mi === a.mi ? 0 : (mi - a.mi) / (b.mi - a.mi);
      return a.min + t * (b.min - a.min);
    }
  }
  return last.min;
}

const STORAGE_KEY = "flowermound-seekonk-triplog-v2";

function fmtClock(d) {
  if (!d) return "--:--";
  return d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
}
function fmtOffset(min) {
  const h = Math.floor(min / 60);
  const m = min % 60;
  return `+${h}h${m ? ` ${m}m` : ""}`;
}
function fmtDelta(min) {
  const abs = Math.round(Math.abs(min));
  const h = Math.floor(abs / 60);
  const m = abs % 60;
  return h > 0 ? `${h}h ${m}m` : `${m}m`;
}
function toLocalInputValue(date) {
  const pad = (n) => String(n).padStart(2, "0");
  return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}T${pad(date.getHours())}:${pad(date.getMinutes())}`;
}
function uid() {
  return Math.random().toString(36).slice(2, 10);
}

function paceDeltaMin(startDate, startOdo, entry) {
  if (!startDate || !entry?.time || entry.odometer === undefined || entry.odometer === "" || entry.odometer === null) return null;
  const actualMiles = Number(entry.odometer) - startOdo;
  if (isNaN(actualMiles)) return null;
  const actualElapsed = (new Date(entry.time) - startDate) / 60000;
  const plannedElapsed = plannedMinAtMiles(actualMiles);
  return actualElapsed - plannedElapsed;
}

function paceLabel(delta) {
  if (delta === null || delta === undefined || isNaN(delta)) return null;
  if (delta > 5) return { text: `${fmtDelta(delta)} behind`, tone: "behind" };
  if (delta < -5) return { text: `${fmtDelta(delta)} ahead`, tone: "ahead" };
  return { text: "on pace", tone: "even" };
}

const TONE_COLOR = { behind: "text-[#C0392B]", ahead: "text-[#2F6F4E]", even: "text-[#8B8F93]" };
const TONE_BG = {
  behind: "bg-[#3A1F1B] border-[#C0392B]/50",
  ahead: "bg-[#1C2E24] border-[#2F6F4E]/50",
  even: "bg-[#1E2226] border-[#33383D]",
};
const ToneIcon = { behind: TrendingDown, ahead: TrendingUp, even: Minus };

function PaceBadge({ delta, size = "sm" }) {
  const p = paceLabel(delta);
  if (!p) return null;
  const IconC = ToneIcon[p.tone];
  const cls = size === "lg" ? "text-sm px-2.5 py-1 gap-1.5" : "text-[10px] px-1.5 py-0.5 gap-1";
  return (
    <span className={`inline-flex items-center rounded-full font-bold uppercase tracking-wide ${cls} ${TONE_COLOR[p.tone]} bg-black/30`}>
      <IconC size={size === "lg" ? 14 : 10} />
      {p.text}
    </span>
  );
}

function DigitReadout({ value, digits = 6, unit }) {
  const str = Math.max(0, Math.round(value || 0)).toString().padStart(digits, "0").slice(-digits);
  return (
    <div className="flex items-end gap-2">
      <div className="flex bg-black rounded-md px-2 py-1.5 shadow-[inset_0_2px_6px_rgba(0,0,0,0.8)] border border-[#33383D]">
        {str.split("").map((d, i) => (
          <span key={i} className="font-mono text-3xl sm:text-4xl font-bold tabular-nums text-[#E8A33D] w-[0.62em] text-center"
                style={{ textShadow: "0 0 8px rgba(232,163,61,0.55)" }}>
            {d}
          </span>
        ))}
      </div>
      {unit && <span className="text-[#8B8F93] text-xs uppercase tracking-widest pb-2">{unit}</span>}
    </div>
  );
}

function StatChip({ icon: IconC, label, value, accent }) {
  return (
    <div className="flex-1 min-w-[100px] bg-[#1E2226] border border-[#33383D] rounded-lg px-3 py-2.5">
      <div className="flex items-center gap-1.5 text-[#8B8F93] text-[10px] uppercase tracking-widest font-semibold mb-1">
        <IconC size={12} strokeWidth={2.5} />
        {label}
      </div>
      <div className={`font-mono text-lg font-bold tabular-nums ${accent || "text-[#EDE8DC]"}`}>{value}</div>
    </div>
  );
}

function FieldLabel({ children, action }) {
  return (
    <div className="flex items-center justify-between mb-1">
      <label className="text-[10px] uppercase tracking-wider text-[#8B8F93] font-semibold">{children}</label>
      {action}
    </div>
  );
}

const inputCls =
  "w-full bg-[#14171A] border border-[#33383D] rounded-lg px-3 py-2 text-sm text-[#EDE8DC] focus:outline-none focus:ring-2 focus:ring-[#E8A33D] placeholder:text-[#5B6066]";

function TripLog() {
  const [loaded, setLoaded] = useState(false);
  const [saving, setSaving] = useState(false);
  const [tripStart, setTripStart] = useState(null);
  const [entries, setEntries] = useState({});
  const [fuelStops, setFuelStops] = useState([]);
  const [openStop, setOpenStop] = useState(null);
  const [openFuelId, setOpenFuelId] = useState(null);
  const [startDraft, setStartDraft] = useState({ time: toLocalInputValue(new Date()), odometer: "" });
  const saveTimer = useRef(null);

  useEffect(() => {
    (async () => {
      try {
        const res = await window.storage.get(STORAGE_KEY);
        if (res && res.value) {
          const data = JSON.parse(res.value);
          if (data.tripStart) setTripStart(data.tripStart);
          if (data.entries) setEntries(data.entries);
          if (data.fuelStops) setFuelStops(data.fuelStops);
        }
      } catch (e) {
      } finally {
        setLoaded(true);
      }
    })();
  }, []);

  const persist = useCallback((next) => {
    if (saveTimer.current) clearTimeout(saveTimer.current);
    setSaving(true);
    saveTimer.current = setTimeout(async () => {
      try {
        await window.storage.set(STORAGE_KEY, JSON.stringify(next));
      } catch (e) {
        console.error("Save failed", e);
      } finally {
        setSaving(false);
      }
    }, 400);
  }, []);

  useEffect(() => {
    if (!loaded) return;
    persist({ tripStart, entries, fuelStops });
  }, [tripStart, entries, fuelStops, loaded, persist]);

  const startDate = tripStart ? new Date(tripStart.time) : null;
  const startOdo = tripStart ? Number(tripStart.odometer) || 0 : 0;

  const enteredCheckpoints = STOPS.filter((s) => entries[s.id]?.odometer);
  const lastCheckpoint = enteredCheckpoints.length ? entries[enteredCheckpoints[enteredCheckpoints.length - 1].id] : null;

  const sortedFuel = [...fuelStops].filter((f) => f.odometer).sort((a, b) => Number(a.odometer) - Number(b.odometer));
  const lastFuelOdo = sortedFuel.length ? Number(sortedFuel[sortedFuel.length - 1].odometer) : null;

  const latestOdo = Math.max(startOdo, lastCheckpoint ? Number(lastCheckpoint.odometer) : 0, lastFuelOdo || 0);
  const totalMiles = tripStart ? latestOdo - startOdo : 0;

  const totalFuelCost = fuelStops.reduce((sum, f) => sum + (Number(f.cost) || 0), 0);
  const totalGallons = fuelStops.reduce((sum, f) => sum + (Number(f.gallons) || 0), 0);
  const costPerMile = totalMiles > 0 ? totalFuelCost / totalMiles : 0;
  const avgMpg = totalGallons > 0 && totalMiles > 0 ? totalMiles / totalGallons : 0;

  const latestPosition = useMemo(() => {
    const candidates = [];
    for (const s of STOPS) {
      const e = entries[s.id];
      if (e?.time && e?.odometer) candidates.push({ time: e.time, odometer: e.odometer, label: s.name, kind: "checkpoint" });
    }
    for (const f of fuelStops) {
      if (f.time && f.odometer) candidates.push({ time: f.time, odometer: f.odometer, label: f.location || "Fuel stop", kind: "fuel" });
    }
    if (!candidates.length) return null;
    candidates.sort((a, b) => new Date(b.time) - new Date(a.time));
    return candidates[0];
  }, [entries, fuelStops]);

  const currentDelta = tripStart && latestPosition ? paceDeltaMin(startDate, startOdo, latestPosition) : null;

  function scheduledDate(stop) {
    if (!startDate) return null;
    return new Date(startDate.getTime() + stop.offsetMin * 60000);
  }
  function revisedScheduledDate(stop) {
    const base = scheduledDate(stop);
    if (!base) return null;
    if (currentDelta === null) return base;
    return new Date(base.getTime() + currentDelta * 60000);
  }

  function handleStartTrip() {
    if (!startDraft.odometer) return;
    setTripStart({ time: new Date(startDraft.time).toISOString(), odometer: startDraft.odometer });
  }
  function updateEntry(stopId, field, val) {
    setEntries((prev) => ({ ...prev, [stopId]: { ...prev[stopId], [field]: val } }));
  }
  function markArrivedNow(stopId) {
    updateEntry(stopId, "time", new Date().toISOString());
  }

  function addFuelStop() {
    const id = uid();
    setFuelStops((prev) => [...prev, { id, location: "", time: new Date().toISOString(), odometer: "", gallons: "", cost: "" }]);
    setOpenFuelId(id);
  }
  function updateFuel(id, field, val) {
    setFuelStops((prev) => prev.map((f) => (f.id === id ? { ...f, [field]: val } : f)));
  }
  function removeFuel(id) {
    setFuelStops((prev) => prev.filter((f) => f.id !== id));
    if (openFuelId === id) setOpenFuelId(null);
  }

  function fuelDerived(fuel) {
    const gallons = Number(fuel.gallons) || 0;
    const cost = Number(fuel.cost) || 0;
    const pricePerGal = gallons > 0 ? cost / gallons : null;
    let milesSincePrev = null;
    let mpgSincePrev = null;
    if (fuel.odometer) {
      const idx = sortedFuel.findIndex((f) => f.id === fuel.id);
      const prevOdo = idx > 0 ? Number(sortedFuel[idx - 1].odometer) : startOdo;
      if (prevOdo || prevOdo === 0) {
        milesSincePrev = Number(fuel.odometer) - prevOdo;
        if (gallons > 0 && milesSincePrev > 0) mpgSincePrev = milesSincePrev / gallons;
      }
    }
    return { pricePerGal, milesSincePrev, mpgSincePrev };
  }

  const orderedFuelStops = [...fuelStops].sort((a, b) => new Date(a.time) - new Date(b.time));
  const pace = paceLabel(currentDelta);
  const PaceIcon = pace ? ToneIcon[pace.tone] : Gauge;

  return (
    <div className="min-h-screen bg-[#14171A] text-[#EDE8DC]" style={{ fontFamily: "system-ui, -apple-system, sans-serif" }}>
      <div className="sticky top-0 z-10 bg-[#14171A]/95 backdrop-blur border-b border-[#33383D] px-4 pt-5 pb-4">
        <div className="flex items-center justify-between mb-3">
          <div className="inline-flex items-center gap-2 bg-[#2F6F4E] border-2 border-[#EDE8DC]/80 rounded px-3 py-1.5">
            <Route size={14} className="text-[#EDE8DC]" strokeWidth={2.5} />
            <span className="text-[11px] font-bold uppercase tracking-widest text-[#EDE8DC]">Flower Mound → Seekonk</span>
          </div>
          <div className="flex items-center gap-1.5 text-[10px] uppercase tracking-wider text-[#8B8F93] font-semibold">
            {saving ? (<><Loader2 size={12} className="animate-spin" /> Saving</>) : loaded ? (<><Check size={12} className="text-[#2F6F4E]" /> Saved</>) : "Loading…"}
          </div>
        </div>

        <DigitReadout value={totalMiles} unit="mi logged" />

        <div className="flex gap-2 mt-3 overflow-x-auto pb-1">
          <StatChip icon={DollarSign} label="Fuel spend" value={`$${totalFuelCost.toFixed(0)}`} accent="text-[#E8A33D]" />
          <StatChip icon={Fuel} label="Avg MPG" value={avgMpg ? avgMpg.toFixed(1) : "—"} />
          <StatChip icon={Gauge} label="$/mile" value={costPerMile ? `$${costPerMile.toFixed(2)}` : "—"} />
        </div>

        {tripStart && (
          <div className={`mt-3 rounded-xl border px-3.5 py-2.5 flex items-center justify-between ${pace ? TONE_BG[pace.tone] : "bg-[#1E2226] border-[#33383D]"}`}>
            <div className="flex items-center gap-2.5">
              <div className={`w-8 h-8 rounded-full flex items-center justify-center bg-black/30 ${pace ? TONE_COLOR[pace.tone] : "text-[#8B8F93]"}`}>
                <PaceIcon size={16} strokeWidth={2.5} />
              </div>
              <div>
                <div className={`text-sm font-bold uppercase tracking-wide leading-tight ${pace ? TONE_COLOR[pace.tone] : "text-[#8B8F93]"}`}>
                  {pace ? pace.text : "No stops logged yet"}
                </div>
                <div className="text-[10px] text-[#8B8F93] leading-tight">
                  {latestPosition ? `as of ${latestPosition.label} · ${fmtClock(new Date(latestPosition.time))}` : "Log a fuel or checkpoint stop to start tracking"}
                </div>
              </div>
            </div>
          </div>
        )}
      </div>

      {!tripStart ? (
        <div className="mx-4 mt-4 bg-[#1E2226] border border-[#33383D] rounded-xl p-4">
          <div className="flex items-center gap-2 mb-3">
            <MapPin size={16} className="text-[#E8A33D]" />
            <h2 className="text-sm font-bold uppercase tracking-wide">Log departure</h2>
          </div>
          <p className="text-[#8B8F93] text-xs mb-3">Enter when you actually left and your starting odometer reading — every stop below recalculates off this.</p>
          <FieldLabel>Departure time</FieldLabel>
          <input type="datetime-local" value={startDraft.time} onChange={(e) => setStartDraft((d) => ({ ...d, time: e.target.value }))} className={`${inputCls} mb-3`} />
          <FieldLabel>Starting odometer (mi)</FieldLabel>
          <input type="number" inputMode="numeric" placeholder="e.g. 48210" value={startDraft.odometer} onChange={(e) => setStartDraft((d) => ({ ...d, odometer: e.target.value }))} className={`${inputCls} mb-4`} />
          <button onClick={handleStartTrip} disabled={!startDraft.odometer} className="w-full bg-[#E8A33D] disabled:bg-[#33383D] disabled:text-[#8B8F93] text-[#14171A] font-bold uppercase tracking-wide text-sm rounded-lg py-2.5 transition-colors">
            Start trip log
          </button>
        </div>
      ) : (
        <div className="mx-4 mt-4 flex items-center justify-between bg-[#1E2226] border border-[#33383D] rounded-lg px-3 py-2 text-xs">
          <span className="text-[#8B8F93]">Departed <span className="text-[#EDE8DC] font-semibold">{fmtClock(startDate)}</span> · odo <span className="text-[#EDE8DC] font-semibold">{startOdo.toLocaleString()}</span></span>
          <button onClick={() => setTripStart(null)} className="text-[#8B8F93] underline decoration-dotted hover:text-[#EDE8DC]">edit</button>
        </div>
      )}

      <div className="px-4 mt-6">
        <div className="flex items-center justify-between mb-2.5">
          <div className="flex items-center gap-2">
            <Fuel size={15} className="text-[#E8A33D]" />
            <h2 className="text-xs font-bold uppercase tracking-widest text-[#EDE8DC]">Fuel stops</h2>
          </div>
          <button onClick={addFuelStop} className="flex items-center gap-1 bg-[#E8A33D] text-[#14171A] text-[11px] font-bold uppercase tracking-wide rounded-full pl-2 pr-3 py-1.5">
            <Plus size={13} strokeWidth={3} /> Log fuel
          </button>
        </div>

        {orderedFuelStops.length === 0 && (
          <div className="text-[#5B6066] text-xs italic border border-dashed border-[#33383D] rounded-lg px-3 py-4 text-center">
            No fuel stops logged yet. Tap "Log fuel" when you pull off — drop in whatever your GPS shows for the location.
          </div>
        )}

        <div className="space-y-2.5">
          {orderedFuelStops.map((fuel, i) => {
            const isOpen = openFuelId === fuel.id;
            const { pricePerGal, milesSincePrev, mpgSincePrev } = fuelDerived(fuel);
            const fuelDelta = tripStart ? paceDeltaMin(startDate, startOdo, fuel) : null;
            return (
              <div key={fuel.id} className="rounded-xl border border-[#33383D] bg-[#1E2226] overflow-hidden">
                <button onClick={() => setOpenFuelId(isOpen ? null : fuel.id)} className="w-full flex items-center justify-between px-4 py-3 text-left">
                  <div className="flex items-center gap-3 min-w-0">
                    <div className="shrink-0 w-7 h-7 rounded-full bg-[#14171A] border border-[#E8A33D]/50 flex items-center justify-center">
                      <Fuel size={13} className="text-[#E8A33D]" />
                    </div>
                    <div className="min-w-0">
                      <div className="text-sm font-bold truncate">{fuel.location || `Fuel stop ${i + 1}`}</div>
                      <div className="text-[11px] text-[#8B8F93] font-mono flex items-center gap-1.5 flex-wrap mt-0.5">
                        {fuel.time && (<span className="flex items-center gap-1"><Clock size={10} />{fmtClock(new Date(fuel.time))}</span>)}
                        {fuel.gallons && <span>{Number(fuel.gallons).toFixed(1)} gal</span>}
                        {fuel.cost && <span className="text-[#E8A33D] font-semibold">${Number(fuel.cost).toFixed(2)}</span>}
                        {mpgSincePrev && <span className="text-[#2F6F4E] font-semibold">{mpgSincePrev.toFixed(1)} mpg</span>}
                      </div>
                      {fuelDelta !== null && (<div className="mt-1"><PaceBadge delta={fuelDelta} /></div>)}
                    </div>
                  </div>
                  <ChevronDown size={16} className={`shrink-0 text-[#8B8F93] transition-transform ${isOpen ? "rotate-180" : ""}`} />
                </button>

                {isOpen && (
                  <div className="px-4 pb-4 pt-1 border-t border-[#33383D] space-y-3">
                    <div>
                      <FieldLabel>Location (from GPS)</FieldLabel>
                      <input type="text" placeholder="e.g. Pilot - Sulphur Springs, TX" value={fuel.location} onChange={(e) => updateFuel(fuel.id, "location", e.target.value)} className={inputCls} />
                    </div>
                    <div>
                      <FieldLabel action={<button onClick={() => updateFuel(fuel.id, "time", new Date().toISOString())} className="text-[10px] uppercase tracking-wider text-[#E8A33D] font-bold">Set to now</button>}>Time</FieldLabel>
                      <input type="datetime-local" value={fuel.time ? toLocalInputValue(new Date(fuel.time)) : ""} onChange={(e) => updateFuel(fuel.id, "time", e.target.value ? new Date(e.target.value).toISOString() : "")} className={inputCls} />
                    </div>
                    <div>
                      <FieldLabel>Odometer (mi)</FieldLabel>
                      <input type="number" inputMode="numeric" placeholder="mi" value={fuel.odometer} onChange={(e) => updateFuel(fuel.id, "odometer", e.target.value)} className={inputCls} />
                    </div>
                    <div className="grid grid-cols-2 gap-2.5">
                      <div>
                        <FieldLabel>Total fuel (gal)</FieldLabel>
                        <input type="number" inputMode="decimal" placeholder="gal" value={fuel.gallons} onChange={(e) => updateFuel(fuel.id, "gallons", e.target.value)} className={inputCls} />
                      </div>
                      <div>
                        <FieldLabel>Total cost ($)</FieldLabel>
                        <input type="number" inputMode="decimal" placeholder="0.00" value={fuel.cost} onChange={(e) => updateFuel(fuel.id, "cost", e.target.value)} className={inputCls} />
                      </div>
                    </div>
                    <div className="flex items-center justify-between pt-1">
                      <div className="text-[11px] text-[#8B8F93] font-mono">
                        {pricePerGal ? `$${pricePerGal.toFixed(2)}/gal` : ""}
                        {milesSincePrev ? ` · ${Math.round(milesSincePrev)} mi since last fill` : ""}
                      </div>
                      <button onClick={() => removeFuel(fuel.id)} className="flex items-center gap-1 text-[#C0392B] text-[11px] font-semibold uppercase tracking-wide">
                        <Trash2 size={12} /> Remove
                      </button>
                    </div>
                  </div>
                )}
              </div>
            );
          })}
        </div>
      </div>

      <div className="px-4 mt-7 pb-10">
        <div className="flex items-center gap-2 mb-2.5">
          <MapPin size={15} className="text-[#EDE8DC]" />
          <h2 className="text-xs font-bold uppercase tracking-widest text-[#EDE8DC]">Route checkpoints</h2>
        </div>
        <div className="space-y-2.5">
          {STOPS.map((stop, idx) => {
            const entry = entries[stop.id] || {};
            const isOpen = openStop === stop.id;
            const hasArrived = !!entry.time;
            const ownDelta = hasArrived ? paceDeltaMin(startDate, startOdo, entry) : null;
            const displayTime = hasArrived ? new Date(entry.time) : revisedScheduledDate(stop);
            const original = scheduledDate(stop);
            const showsRevision = !hasArrived && currentDelta !== null && Math.abs(currentDelta) > 5;

            return (
              <div key={stop.id} className={`rounded-xl border overflow-hidden transition-colors ${stop.final ? "border-[#E8A33D]/60 bg-[#1E2226]" : "border-[#33383D] bg-[#1E2226]"}`}>
                <button onClick={() => setOpenStop(isOpen ? null : stop.id)} className="w-full flex items-center justify-between px-4 py-3 text-left">
                  <div className="flex items-center gap-3 min-w-0">
                    <div className={`shrink-0 w-7 h-7 rounded-full flex items-center justify-center text-[11px] font-bold font-mono ${hasArrived ? "bg-[#2F6F4E] text-[#EDE8DC]" : "bg-[#14171A] border border-[#33383D] text-[#8B8F93]"}`}>
                      {hasArrived ? <Check size={13} /> : idx + 1}
                    </div>
                    <div className="min-w-0">
                      <div className="text-sm font-bold truncate">{stop.name}</div>
                      <div className="text-[11px] text-[#8B8F93] font-mono flex items-center gap-1 flex-wrap">
                        <Clock size={10} />
                        {tripStart ? fmtClock(displayTime) : fmtOffset(stop.offsetMin)}
                        <span className="text-[#5B6066]">{hasArrived ? "arrived" : showsRevision ? "revised" : "sched"}</span>
                        {showsRevision && (<span className="text-[#5B6066] line-through decoration-[#5B6066]">{fmtClock(original)}</span>)}
                      </div>
                      {hasArrived && ownDelta !== null && (<div className="mt-1"><PaceBadge delta={ownDelta} /></div>)}
                    </div>
                  </div>
                  <ChevronDown size={16} className={`shrink-0 text-[#8B8F93] transition-transform ${isOpen ? "rotate-180" : ""}`} />
                </button>

                {isOpen && (
                  <div className="px-4 pb-4 pt-1 border-t border-[#33383D] space-y-3">
                    <div>
                      <FieldLabel action={<button onClick={() => markArrivedNow(stop.id)} className="text-[10px] uppercase tracking-wider text-[#E8A33D] font-bold">Set to now</button>}>Arrival time</FieldLabel>
                      <input type="datetime-local" value={entry.time ? toLocalInputValue(new Date(entry.time)) : ""} onChange={(e) => updateEntry(stop.id, "time", e.target.value ? new Date(e.target.value).toISOString() : "")} className={inputCls} />
                    </div>
                    <div>
                      <FieldLabel>Odometer (mi)</FieldLabel>
                      <input type="number" inputMode="numeric" placeholder="mi" value={entry.odometer || ""} onChange={(e) => updateEntry(stop.id, "odometer", e.target.value)} className={inputCls} />
                    </div>
                    <div>
                      <FieldLabel>Notes</FieldLabel>
                      <input type="text" placeholder="tires checked, traffic on I-81, etc." value={entry.notes || ""} onChange={(e) => updateEntry(stop.id, "notes", e.target.value)} className={inputCls} />
                    </div>
                  </div>
                )}
              </div>
            );
          })}
        </div>
      </div>

      <div className="text-center text-[10px] text-[#8B8F93] pb-6 px-4">
        Pace is based on your most recent logged stop — fuel or checkpoint — using its time and mileage
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<TripLog />);
</script>
</body>
</html>
